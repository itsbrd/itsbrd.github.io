<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account | Project Poop</title>
  <link rel="stylesheet" href="frontpage-style.css" />
</head>

<body>
  <canvas id="scanlines"></canvas>
  <div class="background"></div>

  <!-- top-right account corner (optional but recommended for consistency) -->
  <div class="pp-topright">
    <a id="ppAccountBtn" href="auth.html">Log in</a>
  </div>

  <div class="main-container">
    <h1>ACCOUNT</h1>

    <div class="terminal-box">
      <div class="terminal-line">PROJECT POOP OS // AUTH</div>
      <div class="terminal-line">--------------------------------</div>

      <div class="terminal-line subtle" id="statusLine">status: checking session…</div>
      <div style="height: 14px;"></div>

      <!-- SIGN UP -->
      <div class="terminal-line">create account</div>
      <form id="signupForm" autocomplete="off">
        <input id="signupEmail" class="terminal-input-like" type="email" placeholder="email" required />
        <input id="signupPassword" class="terminal-input-like" type="password" placeholder="password" required />
        <button class="enter-button" type="submit">Sign Up</button>
      </form>

      <div style="height: 18px;"></div>

      <!-- SIGN IN -->
      <div class="terminal-line">log in</div>
      <form id="signinForm" autocomplete="off">
        <input id="signinEmail" class="terminal-input-like" type="email" placeholder="email" required />
        <input id="signinPassword" class="terminal-input-like" type="password" placeholder="password" required />
        <button class="enter-button" type="submit">Sign In</button>
      </form>

      <div style="height: 18px;"></div>

      <!-- SIGN OUT -->
      <button class="enter-button" id="signoutBtn" type="button">Sign Out</button>

      <div style="height: 14px;"></div>
      <div class="terminal-line subtle" id="msgLine"></div>

      <div style="height: 16px;"></div>
      <a href="index.html" class="enter-button">Return Home</a>
    </div>
  </div>

  <script>
    // reuse your scanlines approach
    function drawScanlines() {
      const canvas = document.getElementById('scanlines');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = window.innerWidth;
      const height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      for (let y = 0; y < height; y += 2) ctx.fillRect(0, y, width, 1);
    }
    window.addEventListener('load', drawScanlines);
    window.addEventListener('resize', drawScanlines);
  </script>

  <script type="module">
    import { supabase } from "./supabaseClient.js";

    const statusLine = document.getElementById("statusLine");
    const msgLine = document.getElementById("msgLine");

    const signupForm = document.getElementById("signupForm");
    const signinForm = document.getElementById("signinForm");
    const signoutBtn = document.getElementById("signoutBtn");

    const topRightBtn = document.getElementById("ppAccountBtn");

    function setMsg(text, isError=false){
      msgLine.textContent = text || "";
      msgLine.style.opacity = text ? "1" : "0.6";
      msgLine.style.color = isError ? "rgba(255,120,120,0.95)" : "rgba(255,255,255,0.8)";
    }

    function isEmailConfirmed(user){
      // Supabase uses email_confirmed_at; confirmed_at exists in some contexts
      return !!(user?.email_confirmed_at || user?.confirmed_at);
    }

    async function exchangeCodeIfPresent(){
      // Handles email-confirm redirect links like ?code=...
      const url = new URL(window.location.href);
      const code = url.searchParams.get("code");
      if (!code) return;

      statusLine.textContent = "status: finalizing sign-in…";

      const { error } = await supabase.auth.exchangeCodeForSession(code);
      if (error){
        setMsg("Code exchange failed: " + error.message, true);
        return;
      }

      // clean up URL (remove ?code=...)
      url.searchParams.delete("code");
      window.history.replaceState({}, document.title, url.toString());
    }

    async function getProfile(userId){
      // This requires your Supabase table: public.profiles (id uuid PK, username text, etc.)
      const { data, error } = await supabase
        .from("profiles")
        .select("username")
        .eq("id", userId)
        .maybeSingle();

      if (error) throw error;
      return data; // may be null
    }

    async function refreshSessionUI(){
      const { data, error } = await supabase.auth.getSession();
      if (error){
        statusLine.textContent = "status: error reading session";
        setMsg(error.message, true);
        if (topRightBtn){
          topRightBtn.textContent = "Log in";
          topRightBtn.href = "auth.html";
        }
        return;
      }

      const session = data.session;
      const user = session?.user;

      if (!user){
        statusLine.textContent = "status: signed out";
        setMsg("");
        if (topRightBtn){
          topRightBtn.textContent = "Log in";
          topRightBtn.href = "auth.html";
        }
        return;
      }

      // If they're signed in, check whether they need setup
      statusLine.textContent = `status: signed in as ${user.email}`;

      // If not confirmed, tell them and keep them here
      if (!isEmailConfirmed(user)){
        setMsg("Check your email and confirm your account to continue.");
        if (topRightBtn){
          topRightBtn.textContent = "Log in";
          topRightBtn.href = "auth.html";
        }
        return;
      }

      // Confirmed: if username missing, force setup
      try{
        const profile = await getProfile(user.id);

        if (!profile?.username){
          setMsg("Email confirmed. Redirecting to setup…");
          setTimeout(() => window.location.href = "setup.html", 300);
          return;
        }

        // Username exists: show it in top-right and optionally bounce home
        if (topRightBtn){
          topRightBtn.textContent = profile.username;
          topRightBtn.href = "setup.html";
        }
        setMsg("You're all set.");
      } catch (e){
        // If profiles table isn't ready, at least don't hang
        setMsg("Profile check failed: " + (e?.message || String(e)), true);
      }
    }

    signupForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMsg("");

      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;

      try{
        const { error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            // IMPORTANT: add this URL in Supabase Auth → URL Configuration → Additional Redirect URLs
            emailRedirectTo: "https://projectpoop.org/setup.html"
          }
        });

        if (error){
          setMsg(error.message, true);
          return;
        }

        setMsg("Sign up sent. Check your email to confirm, then you'll be taken to setup.");
        await refreshSessionUI();
      } catch (err){
        setMsg("Sign up failed: " + (err?.message || String(err)), true);
      }
    });

    signinForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      setMsg("");

      const email = document.getElementById("signinEmail").value.trim();
      const password = document.getElementById("signinPassword").value;

      try{
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error){
          setMsg(error.message, true);
          return;
        }

        setMsg("Signed in.");
        await refreshSessionUI();
      } catch (err){
        setMsg("Sign in failed: " + (err?.message || String(err)), true);
      }
    });

    signoutBtn.addEventListener("click", async () => {
      setMsg("");
      const { error } = await supabase.auth.signOut();
      if (error){
        setMsg(error.message, true);
        return;
      }
      setMsg("Signed out.");
      await refreshSessionUI();
    });

    // Run: handle email-confirm redirect, then refresh
    await exchangeCodeIfPresent();

    // keep UI synced if auth state changes
    supabase.auth.onAuthStateChange(() => refreshSessionUI());
    await refreshSessionUI();
  </script>
</body>
</html>
