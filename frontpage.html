<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Poop</title>
  <link rel="stylesheet" href="frontpage-style.css" />
  <link rel="icon" type="image/x-icon" href="favicon.jpeg" />
</head>
<body>
  <!-- CRT scanlines -->
  <canvas id="scanlines" aria-hidden="true"></canvas>

  <!-- Background -->
  <div class="background"></div>
  <div class="background-overlay"></div>

  <div class="hud">
    <div id="songs-found">Songs Found: 0/52</div>
  </div>

  <main class="page">
    <div class="album-wrap">
      <img class="album-art" src="cover.jpg" alt="Album art" />
    </div>

    <section class="playlist" id="playlist" aria-label="Playlist"></section>

    <footer class="footer">
      PROJECT POOP is a subsidiary of DARK SIGMA INC., owned and operated by FREEZY LLC. Copyright 2025
    </footer>
  </main>

  <!-- Tap-to-enable hint (iOS/Safari sometimes blocks first play) -->
  <div id="tap-overlay" class="tap-overlay" hidden>
    <div class="tap-box">
      Tap anywhere to enable audio
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
