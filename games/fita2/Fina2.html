<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>A Fly in the Array 2</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      min-height: 100%;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      gap: 14px;
      font-family: "Pix32", monospace;
      color: #eaeaea;
    }

    .game-title {
      text-align: center;
      text-shadow:
        0 0 2px rgba(255,255,255,0.3),
        0 0 8px rgba(255,255,255,0.15);
    }

    .game-shell {
      width: 800px;
      height: 600px;
      max-width: 100%;
      border: 2px solid rgba(255,255,255,0.18);
      background: #000;
      box-shadow: 0 0 18px rgba(255,255,255,0.12);
      overflow: hidden;
    }

    .game-shell iframe {
      display: block;
      width: 800px;
      height: 600px;
      border: 0;
    }

    .back-link {
      color: #b9b9b9;
      text-decoration: none;
    }

    .back-link:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="game-title">A Fly in the Array 2</div>

  <div class="game-shell">
    <iframe
      src="./fina2.html"
      title="A Fly in the Array 2"
      scrolling="no"
      frameborder="0">
    </iframe>
  </div>

  <a class="back-link" href="/">return to projectpoop.org</a>
</body>
</html>
