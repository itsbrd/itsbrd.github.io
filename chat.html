<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Poop — Chat</title>
  <link rel="stylesheet" href="chat-style.css" />
</head>
<body>

<canvas id="scanlines"></canvas>
<div class="background"></div>

<header class="topbar">
  <div class="title">
    PROJECT POOP CHAT
    <span id="online-pill" class="pill">0 online</span>
  </div>
  <div class="topbar-right">
    <button id="name-btn" class="btn" type="button">Set Name</button>
  </div>
</header>

<main class="wrap">
  <section class="main-col">
    <div id="chat-log" class="chat-log" aria-live="polite"></div>
    <div id="typing" class="typing" aria-live="polite"></div>

    <form id="chat-form" class="chat-form" autocomplete="off">
      <input id="chat-input" class="chat-input" type="text" placeholder="type a message…" maxlength="280"/>
      <button class="btn" type="submit">Send</button>
    </form>

    <div id="chat-status" class="status" aria-live="polite"></div>
  </section>

  <aside class="side-col">
    <div class="side-title">ONLINE</div>
    <div id="user-list" class="user-list"></div>
  </aside>
</main>

<script type="module" src="chat.js"></script>

<script>
function drawScanlines(){
  const canvas=document.getElementById("scanlines");
  const ctx=canvas.getContext("2d");
  const w=window.innerWidth;
  const h=window.innerHeight;

  canvas.width=w;
  canvas.height=h;

  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="rgba(0,0,0,0.55)";
  for(let y=0;y<h;y+=2){ ctx.fillRect(0,y,w,1); }
}
window.addEventListener("load",drawScanlines);
window.addEventListener("resize",drawScanlines);
</script>

</body>
</html>
