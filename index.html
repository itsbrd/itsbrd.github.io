<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Poop — Auth</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-container">
    <h1>Welcome to Project Poop</h1>

    <form id="auth-form">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <div class="button-group">
        <button type="button" id="signup-btn">Sign Up</button>
        <button type="button" id="login-btn">Log In</button>
      </div>
    </form>

    <div id="auth-message"></div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://qmlhagpdfnckuufhhixu.supabase.co",
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtbGhhZ3BkZm5ja3V1ZmhoaXh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTkwMTEzMTIsImV4cCI6MjA3NDU4NzMxMn0.HFrgVdnETfPL6EDa9lrj0SwZkEFehMbDUjvkq7VkRTk"
    );

    const emailField = document.getElementById("email");
    const passwordField = document.getElementById("password");
    const message = document.getElementById("auth-message");

    document.getElementById("signup-btn").addEventListener("click", async () => {
      const email = emailField.value.trim();
      const password = passwordField.value;

      const { error } = await supabase.auth.signUp({ email, password });
      if (error) {
        message.textContent = `Signup error: ${error.message}`;
      } else {
        message.textContent = "Signup successful! Check your email to confirm.";
      }
    });

    document.getElementById("login-btn").addEventListener("click", async () => {
      const email = emailField.value.trim();
      const password = passwordField.value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        message.textContent = `Login error: ${error.message}`;
      } else {
        message.textContent = "Login successful!";
        window.location.href = "page2.html";
      }
    });
  </script>

</body>
</html>
