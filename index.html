<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music</title>
  <style>
    :root {
      --max: 780px;
    }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      line-height: 1.35;
    }

    .wrap {
      max-width: var(--max);
      margin: 0 auto;
    }

    /* Album cover */
    .cover {
      width: 100%;
      max-width: 560px;
      display: block;
      margin: 0 auto 18px;
      border-radius: 12px;
    }

    /* Song list */
    .song-row {
      margin: 0 0 16px;
      padding: 12px;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 12px;
    }

    .song-title {
      font-weight: 650;
      margin: 0 0 8px;
      overflow-wrap: anywhere;
    }

    audio {
      width: 100%;
    }

    #status {
      opacity: 0.75;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <!-- Album cover (root/cover.jpg) -->
    <img class="cover" src="./cover.jpg" alt="Album cover" />

    <!-- Songs get injected here -->
    <div id="song-list"></div>
    <div id="status"></div>
  </div>

  <script src="./songs.js"></script>
</body>
</html>
