<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Poop</title>
  <link rel="stylesheet" href="frontpage-style.css" />
  <style>
    /* Home screen layout (keeps the same CRT/background vibe as the music page) */
    .home-wrap{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .home-panel{
      width:min(560px, 92vw);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:18px;
      background:rgba(0,0,0,0.55);
      box-shadow: 0 12px 36px rgba(0,0,0,0.55);
      padding:22px;
      position:relative;
    }
    .home-title{
      font-weight:700;
      letter-spacing:0.08em;
      text-transform:uppercase;
      opacity:0.9;
      margin:0 0 14px 0;
      font-size:14px;
    }
    .home-buttons{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }
    .home-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      padding:14px 16px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.18);
      background:rgba(0,0,0,0.35);
      color:var(--fg);
      text-decoration:none;
      font-weight:600;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      min-width: 140px;
    }
    .home-btn:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.5);
    }

    /* Terminal prompt (placeholder for the command system) */
    .terminal-bar{
      position:fixed;
      left:0; right:0; bottom:0;
      padding:12px 14px calc(12px + env(safe-area-inset-bottom));
      background: rgba(0,0,0,0.72);
      border-top:1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index:5;
    }
    .terminal-inner{
      max-width: 900px;
      margin: 0 auto;
      display:flex;
      flex-direction:column;
      align-items:stretch;
      gap:6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: var(--fg);
    }

    .terminal-row{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .terminal-prompt{
      opacity:0.9;
      user-select:none;
    }
    .terminal-input{
      flex:1;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--fg);
      font-size: 14px;
      padding: 6px 4px;
    }

    .terminal-output{
      width:100%;
      max-height: 180px;
      overflow:auto;
      padding: 0 2px 8px 2px;
      font-size: 13px;
      line-height: 1.35;
      opacity: 0.95;
    }
    .terminal-line{
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0 0 6px 0;
    }
    .terminal-line .muted{ opacity:0.65; }

    .terminal-hint{
      opacity:0.55;
      font-size:12px;
      margin-left:auto;
      user-select:none;
      white-space:nowrap;
    }

    /* Give the centered panel breathing room above the terminal */
    .home-spacer{
      height: 78px; /* roughly terminal height */
    }
  </style>
</head>

<body>
  <canvas id="scanlines"></canvas>
  <div class="background"></div>

  <div class="home-wrap">
    <div>
      <div class="home-panel">
        <p class="home-title">Project Poop</p>

        <div class="home-buttons">
          <a class="home-btn" href="frontpage.html">Music</a>
          <a class="home-btn" href="chat.html">Chat Room</a>
          <a href="about.html" class="home-btn">About</a>
        </div>
      </div>

      <div class="home-spacer" aria-hidden="true"></div>
    </div>
  </div>

  <div class="terminal-bar" role="region" aria-label="Terminal">
    <div class="terminal-inner">
      <div class="terminal-output" aria-live="polite"></div>
      <div class="terminal-row">
        <span class="terminal-prompt">&gt;</span>
      <input class="terminal-input" type="text" placeholder="type a command (try: help)" autocomplete="off" autocapitalize="off" spellcheck="false" />
      <span class="terminal-hint">help • music • chat • clear</span>
      </div>
    </div>
  </div>

  <script>
    // Scanlines (same simple approach as your music page)
    function drawScanlines() {
      const canvas = document.getElementById('scanlines');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = window.innerWidth;
      const height = window.innerHeight;

      canvas.width = width;
      canvas.height = height;

      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = 'rgba(0,0,0,0.55)';

      for (let y = 0; y < height; y += 2) {
        ctx.fillRect(0, y, width, 1);
      }
    }

    window.addEventListener('load', drawScanlines);
    window.addEventListener('resize', drawScanlines);


    // ===== Terminal (lightweight v1) =====
    const termInput = document.querySelector('.terminal-input');
    const termOut   = document.querySelector('.terminal-output');

    const HISTORY_KEY = 'pp_term_history_v1';
    let history = [];
    try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { history = []; }
    let histIdx = history.length;

    function printLine(text, cls=''){
      if (!termOut) return;
      const p = document.createElement('p');
      p.className = 'terminal-line' + (cls ? ` ${cls}` : '');
      p.textContent = text;
      termOut.appendChild(p);
      termOut.scrollTop = termOut.scrollHeight;
    }

    function printBannerOnce(){
      const seenKey = 'pp_term_seen_v1';
      if (localStorage.getItem(seenKey)) return;
      localStorage.setItem(seenKey, '1');
      printLine('ProjectPoop Terminal v1');
      printLine('Type "help" to see commands.');
    }

    function runCommand(raw){
      const input = (raw || '').trim();
      if (!input) return;

      history.push(input);
      if (history.length > 50) history.shift();
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      histIdx = history.length;

      printLine('> ' + input);

      const [cmd, ...rest] = input.split(/\s+/);
      const c = (cmd || '').toLowerCase();
      const arg = rest.join(' ');

      switch (c){
        case 'help':
          printLine('Commands:');
          printLine('  help   - show this list');
          printLine('  music  - open the music page');
          printLine('  chat   - open the chat room');
          printLine('  clear  - clear terminal output');
          printLine('  home   - reload the home page');
          break;

        case 'music':
          printLine('Opening music…');
          window.location.href = 'frontpage.html';
          break;

        case 'chat':
        case 'chatroom':
          printLine('Opening chat room…');
          window.location.href = 'chat.html';
          break;

        case 'home':
          printLine('Returning home…');
          window.location.href = 'index.html';
          break;

        case 'clear':
          if (termOut) termOut.innerHTML = '';
          break;

        default:
          printLine(`Unknown command: ${cmd}`);
          printLine('Type "help" for commands.');
          break;
      }
    }

    if (termInput){
      printBannerOnce();

      termInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter'){
          e.preventDefault();
          const val = termInput.value;
          termInput.value = '';
          runCommand(val);
        } else if (e.key === 'ArrowUp'){
          if (!history.length) return;
          e.preventDefault();
          histIdx = Math.max(0, histIdx - 1);
          termInput.value = history[histIdx] ?? '';
          // move cursor to end
          termInput.setSelectionRange(termInput.value.length, termInput.value.length);
        } else if (e.key === 'ArrowDown'){
          if (!history.length) return;
          e.preventDefault();
          histIdx = Math.min(history.length, histIdx + 1);
          termInput.value = history[histIdx] ?? '';
          termInput.setSelectionRange(termInput.value.length, termInput.value.length);
        } else if (e.key === 'Escape'){
          termInput.value = '';
        }
      });
    }

  </script>
</body>
</html>
